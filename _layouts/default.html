<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title | escape }}</title>
  <meta name="description" content="{{ site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ site.description | escape }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <style>
    :root { color-scheme: light; --ink:#172c3c; --muted:#50616d; --accent:#075d6d; --line:#dce5e8; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; background:#f5f7f8; color:var(--ink); font:17px/1.7 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    a { color:var(--accent); text-underline-offset:3px; }
    a:hover { color:#023f4c; }
    a:focus-visible { outline:3px solid #df9d26; outline-offset:4px; }
    .skip-link { position:absolute; left:16px; top:-80px; background:white; padding:8px 12px; z-index:2; }
    .skip-link:focus { top:8px; }
    .shell { max-width:1120px; margin:auto; padding:56px 36px; display:grid; grid-template-columns:230px minmax(0,1fr); gap:64px; }
    header { position:sticky; top:40px; align-self:start; }
    .name { margin:0 0 12px; font-size:28px; font-weight:750; letter-spacing:-1px; line-height:1.2; }
    .name a { color:var(--ink); text-decoration:none; }
    .tagline { color:var(--muted); font-size:15px; line-height:1.6; }
    nav { display:flex; flex-direction:column; gap:10px; margin:28px 0; font-size:15px; }
    nav a { text-decoration:none; }
    .contact { font-size:14px; }
    main { min-width:0; background:white; border:1px solid var(--line); border-radius:12px; padding:40px; }
    h1,h2,h3 { line-height:1.25; letter-spacing:-.025em; }
    h1 { margin:0 0 26px; font-size:clamp(30px,4vw,42px); }
    h2 { margin:48px 0 20px; padding-top:26px; border-top:1px solid var(--line); font-size:25px; scroll-margin-top:24px; }
    h3 { margin:30px 0 8px; font-size:21px; }
    p { margin:0 0 18px; }
    ul { margin:0 0 22px; padding-left:22px; }
    li { margin:0 0 10px; }
    strong { font-weight:650; }
    footer { max-width:1120px; margin:auto; padding:0 36px 36px; color:var(--muted); font-size:13px; }
    @media (max-width:800px) {
      .shell { grid-template-columns:1fr; gap:28px; padding:28px 20px; }
      header { position:static; }
      .tagline { max-width:38em; }
      nav { flex-direction:row; flex-wrap:wrap; gap:10px 22px; margin:18px 0; }
      main { padding:28px 24px; }
      footer { padding:0 20px 24px; }
    }
    @media (max-width:420px) { .shell { padding:24px 12px; } main { padding:26px 18px; } }
    @media (prefers-reduced-motion:reduce) { html { scroll-behavior:auto; } }
    @media print {
      body { background:white; font-size:11pt; }
      .shell { display:block; padding:0; }
      header { position:static; margin-bottom:20px; }
      nav,.contact,.skip-link,footer { display:none; }
      main { border:0; padding:0; }
      h2,h3 { break-after:avoid; }
      a { color:inherit; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="shell">
    <header>
      <p class="name"><a href="{{ '/' | relative_url }}">{{ site.title | escape }}</a></p>
      <p class="tagline">{{ site.description | escape }}</p>
      <nav aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}#what-i-bring">Focus</a>
        <a href="{{ '/' | relative_url }}#experience">Experience</a>
        <a href="{{ '/' | relative_url }}#how-i-lead">How I lead</a>
        <a href="{{ '/' | relative_url }}#education-and-continued-learning">Learning</a>
      </nav>
      <p class="contact"><a href="{{ site.owner_linkedin_url | escape }}">LinkedIn</a> · <a href="mailto:{{ site.owner_email | escape }}">Email</a></p>
    </header>
    <main id="main" tabindex="-1">{{ content }}</main>
  </div>
  <footer>© {{ site.time | date: '%Y' }} Alex Shulga · Hosted on GitHub Pages</footer>
</body>
</html>
