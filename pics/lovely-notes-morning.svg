<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="title description" font-family="system-ui, -apple-system, sans-serif"><title id="title">On-demand daily planning</title><desc id="description">Previous working day, goals and recurring activity configuration inform a plan that a manager reviews.</desc><rect width="900" height="480" rx="12" fill="#f4f8fa"/><rect x="275" y="18" width="350" height="50" rx="8" fill="#17394b" stroke="#17394b" stroke-width="1.5"/><text x="450" y="50.36" fill="#fff" font-size="23" font-weight="650" text-anchor="middle">/morning · explicit invocation</text><path d="M450 68 V87 H160 V101 M450 87 V101 M450 87 H740 V101" fill="none" stroke="#8499a5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="28" y="101" width="264" height="70" rx="8" fill="#e3f1ef" stroke="#8bb8b5" stroke-width="1.5"/><text x="160" y="130.04" fill="#17394b" font-size="22" font-weight="650" text-anchor="middle">Previous working day</text><text x="160" y="156.04" fill="#17394b" font-size="19" font-weight="400" text-anchor="middle">Outstanding work</text><path d="M160 171 V190 H450" fill="none" stroke="#8499a5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="318" y="101" width="264" height="70" rx="8" fill="#e3f1ef" stroke="#8bb8b5" stroke-width="1.5"/><text x="450" y="130.04" fill="#17394b" font-size="22" font-weight="650" text-anchor="middle">Quarterly objectives</text><text x="450" y="156.04" fill="#17394b" font-size="19" font-weight="400" text-anchor="middle">Agreed priorities</text><path d="M450 171 V190 H450" fill="none" stroke="#8499a5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="608" y="101" width="264" height="70" rx="8" fill="#e3f1ef" stroke="#8bb8b5" stroke-width="1.5"/><text x="740" y="130.04" fill="#17394b" font-size="22" font-weight="650" text-anchor="middle">YAML cadence</text><text x="740" y="156.04" fill="#17394b" font-size="19" font-weight="400" text-anchor="middle">Recurring activities</text><path d="M740 171 V190 H450" fill="none" stroke="#8499a5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M450 190 V205" fill="none" stroke="#8499a5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="135" y="205" width="630" height="74" rx="8" fill="#17394b" stroke="#17394b" stroke-width="1.5"/><text x="450" y="235.86" fill="#fff" font-size="23" font-weight="650" text-anchor="middle">Assemble and prioritize</text><text x="450" y="262.86" fill="#fff" font-size="20" font-weight="400" text-anchor="middle">Calendar exceptions · carryover · due activities</text><path d="M450 279 V296" fill="none" stroke="#8499a5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="135" y="296" width="630" height="66" rx="8" fill="#e3f1ef" stroke="#8bb8b5" stroke-width="1.5"/><text x="450" y="322.86" fill="#17394b" font-size="23" font-weight="650" text-anchor="middle">Proposed daily plan</text><text x="450" y="349.86" fill="#17394b" font-size="20" font-weight="400" text-anchor="middle">Goal-aligned tasks and recurring routines</text><path d="M450 362 V380" fill="none" stroke="#8499a5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="220" y="380" width="460" height="55" rx="8" fill="#fbf0df" stroke="#b48c50" stroke-width="1.5"/><text x="450" y="414.86" fill="#17394b" font-size="23" font-weight="650" text-anchor="middle">Manager reviews and acts</text><text x="450" y="461" text-anchor="middle" fill="#526475" font-size="17">No background scheduler or unnecessary model runs</text></svg>