<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 515" role="img" aria-labelledby="title" font-family="system-ui, sans-serif"><title id="title">Strategic Brief Agent proposed workflow</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#718496"/></marker></defs><rect width="900" height="515" rx="12" fill="#fff"/><rect x="30" y="20" width="840" height="68" rx="9" fill="#e2f1ed" stroke="#28796b"/><text x="450" y="48" font-size="18" font-weight="600" text-anchor="middle" fill="#192b3a">Approved signals</text><text x="450" y="70" font-size="15" font-weight="400" text-anchor="middle" fill="#192b3a">Customer needs, industry developments, internal innovation</text><path d="M450 88 V110" fill="none" stroke="#718496" stroke-width="2" marker-end="url(#arrow)"/><rect x="170" y="110" width="560" height="76" rx="9" fill="#e2f1ed" stroke="#28796b"/><text x="450" y="142" font-size="18" font-weight="600" text-anchor="middle" fill="#192b3a">Bounded agent investigation</text><text x="450" y="164" font-size="15" font-weight="400" text-anchor="middle" fill="#192b3a">Plan, retrieve evidence, reassess, escalate uncertainty</text><path d="M450 186 V208" fill="none" stroke="#718496" stroke-width="2" marker-end="url(#arrow)"/><rect x="170" y="208" width="560" height="76" rx="9" fill="#f3f5f8" stroke="#8290a1"/><text x="450" y="240" font-size="18" font-weight="600" text-anchor="middle" fill="#192b3a">Evidence-backed strategic brief</text><text x="450" y="262" font-size="15" font-weight="400" text-anchor="middle" fill="#192b3a">Opportunity, sources, assumptions, alternatives, value and effort</text><path d="M450 284 V306" fill="none" stroke="#718496" stroke-width="2" marker-end="url(#arrow)"/><rect x="170" y="306" width="560" height="76" rx="9" fill="#e2f1ed" stroke="#28796b"/><text x="450" y="338" font-size="18" font-weight="600" text-anchor="middle" fill="#192b3a">Leadership dialogue</text><text x="450" y="360" font-size="15" font-weight="400" text-anchor="middle" fill="#192b3a">Challenge assumptions and debate priorities</text><path d="M450 382 V404" fill="none" stroke="#718496" stroke-width="2" marker-end="url(#arrow)"/><rect x="170" y="404" width="560" height="68" rx="9" fill="#f3f5f8" stroke="#8290a1"/><text x="450" y="432" font-size="18" font-weight="600" text-anchor="middle" fill="#192b3a">Human decision</text><text x="450" y="454" font-size="15" font-weight="400" text-anchor="middle" fill="#192b3a">Strategy and resource commitments remain human-owned</text><text x="450" y="498" text-anchor="middle" font-size="14" fill="#526475">Proposed design · read-only pilot · bounded outputs · evaluation and review</text></svg>